services:
  macros-api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    expose:
      - "5000"
    networks:
      - web
  macros-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    depends_on:
      - macros-api
    networks:
      - web

networks:
  web:
    external: true
