services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
    env_file:
      - .env
    
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules